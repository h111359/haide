<div class="demo-bar"><strong>INTERACTIVE UX PROPOSAL</strong><span class="demo-description">Fictional data. Workflow actions are simulated; no agent or product files are changed.</span><span class="spacer"></span><label for="scenario">Preview state</label><select id="scenario"><option value="approval">Awaiting approval</option><option value="running">Implementing</option><option value="blocked">Blocked · failed test</option><option value="ready">Ready to close</option><option value="setup">Setup pending</option><option value="empty">No active request</option></select><button id="reset-demo">Reset demo</button></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy=x=>JSON.parse(JSON.stringify(x));
const fonts={system:{label:'System sans',value:"'Segoe UI',system-ui,-apple-system,sans-serif"},humanist:{label:'Humanist sans',value:"'Trebuchet MS',Verdana,sans-serif"},serif:{label:'Classic serif headings',value:"Georgia,'Times New Roman',serif"},arial:{label:'Arial sans',value:'Arial,Helvetica,sans-serif'}};
const themes={
 clear:{name:'Clear',description:'Cool neutrals · system sans',font:'system',heading:'system',mode:'light',colors:{bg:'#f4f6f8',surface:'#ffffff',raised:'#edf1f5',text:'#172337',muted:'#536279',border:'#cbd4df',accent:'#2457be','on-accent':'#ffffff',positive:'#166544',warning:'#805212',danger:'#b12c3b',focus:'#855bce'}},
 midnight:{name:'Midnight',description:'Deep blue · system sans',font:'system',heading:'system',mode:'dark',colors:{bg:'#101722',surface:'#192332',raised:'#243144',text:'#edf3fb',muted:'#b4c1d3',border:'#475973',accent:'#a5c5ff','on-accent':'#102244',positive:'#8cdbb3',warning:'#f4cc85',danger:'#ffa9b0',focus:'#c4acff'}},
 warm:{name:'Warm',description:'Paper neutrals · serif headings',font:'system',heading:'serif',mode:'light',colors:{bg:'#f5f1e9',surface:'#fffcf5',raised:'#efe7d9',text:'#322a25',muted:'#685b4d',border:'#cbbfae',accent:'#805033','on-accent':'#ffffff',positive:'#356140',warning:'#80520e',danger:'#a13239',focus:'#8754a4'}},
 contrast:{name:'Contrast',description:'Black & white · Arial',font:'arial',heading:'arial',mode:'dark',colors:{bg:'#050505',surface:'#101010',raised:'#252525',text:'#ffffff',muted:'#e0e0e0',border:'#999999',accent:'#ffdf60','on-accent':'#050505',positive:'#a8ffbb',warning:'#ffdf60',danger:'#ffb3b3',focus:'#70ddff'}}
};
const defaultPrefs={theme:'clear',size:16,custom:null};
let savedPrefs=copy(defaultPrefs),prefs,storageAvailable=true;
try{const raw=JSON.parse(localStorage.getItem('aih-theme-demo-v1')||'null'); if(raw&&['clear','midnight','warm','contrast','custom','system'].includes(raw.theme)){raw.size=Math.min(22,Math.max(14,Number(raw.size)||16));if(raw.custom){const c=raw.custom; if(!fonts[c.font]||!fonts[c.heading]||!c.colors||Object.keys(themes.clear.colors).some(k=>!/^#[\da-f]{6}$/i.test(c.colors[k]||'')))raw.custom=null;}if(raw.theme==='custom'&&!raw.custom)raw.theme='clear';savedPrefs=raw;}}catch{storageAvailable=false;}prefs=copy(savedPrefs);
const state={scenario:'approval',approved:false,direct:false,stopped:false,dirty:false,themeDirty:false,submitted:3,input:'Create an Excel export for the current report.\n\nUsers should be able to download the filtered rows with readable column headings. Respect the same access rules as the report.\n\nWhy: finance teams need to work with report data offline.',question:'',answer:false,defectSaved:'',pendingSubmission:null,doc:'exports',settings:'appearance',events:[],closed:false};
let inputSaved=state.input,submittedInput=state.input,route='',pendingRoute=null,toastTimer,modalConfirm=null;
function effectiveTheme(){if(prefs.theme==='system')return themes[matchMedia('(prefers-color-scheme: dark)').matches?'midnight':'clear'];return prefs.theme==='custom'&&prefs.custom?prefs.custom:themes[prefs.theme]||themes.clear;}
function applyTheme(){const t=effectiveTheme(),root=document.documentElement;Object.entries(t.colors).forEach(([k,v])=>root.style.setProperty('--'+k,v));root.style.setProperty('--font',fonts[t.font].value);root.style.setProperty('--heading',fonts[t.heading].value);root.style.fontSize=prefs.size+'px';root.style.colorScheme=t.mode;}
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(prefs.theme==='system')applyTheme();});
function toast(msg){$('#toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',6500);}
function dialog(title,body,buttons=[]){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-actions').innerHTML=buttons.map((b,i)=>`<button data-dialog-choice="${i}" class="${b.class||''}">${esc(b.label)}</button>`).join('');modalConfirm=buttons;$('#modal').showModal();}
function closeDialog(){$('#modal').close();modalConfirm=null;}
function pill(text,type=''){return `<span class="pill ${type}">${text}</span>`;}
function link(text,path,cls=''){return `<a class="${cls}" href="#${path}">${text}</a>`;}
function btn(text,action,cls='',disabled=false){return `<button data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${text}</button>`;}
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">Northstar Analytics / workspace</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`;}
function status(){if(state.scenario==='empty')return 'No active request';if(state.scenario==='setup')return 'Setup pending';if(state.stopped)return 'Stopped at checkpoint';return {approval:state.approved?'Plan approved':'Awaiting plan approval',running:'Implementing · task 2 of 5',blocked:'Blocked · required test failed',ready:'Ready to close'}[state.scenario];}
function hasRequest(){return !['empty','setup'].includes(state.scenario);}
function requestTabs(tab){const tabs=[['input','Input and clarification'],['analysis','Analysis'],['plan','Plan'],['implementation','Implementation'],['verification','Verification and documentation'],['outcome','Outcome']];return `<nav class="tabs" aria-label="Request sections">${tabs.map(([id,label])=>`<a href="#request/${id}" ${tab===id?'aria-current="page"':''}>${label}</a>`).join('')}</nav>`;}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;}
function renderShell(page){const links=[['overview','◈','Overview'],['request','▤','Current request'],['questions','?','Ask a question'],['docs','▥','Product documentation'],['runs','◷','Runs and recovery'],['history','≡','History and decisions'],['settings','⚙','Settings'],['help','ⓘ','Help']];$('#navigation').innerHTML=links.map(([id,icon,label])=>`<a class="nav-link" href="#${id}/${{request:'input',docs:'exports',settings:'appearance',help:'guide'}[id]||'main'}" ${page===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</a>`).join('');$('#context').innerHTML=`<div><div class="product">Northstar Analytics</div><div class="hint">Example product · local workspace</div></div><div class="context-detail">${hasRequest()?'<span class="mono">CR-0042</span>':''}${pill(status(),state.scenario==='blocked'?'bad':state.scenario==='ready'?'good':'accent')}<span>Profile: ${state.scenario==='setup'?'not configured':'Local agent (example)'}</span></div><button class="appearance" data-action="appearance">Appearance · ${esc(prefs.theme==='system'?'System':effectiveTheme().name)}</button>`;$('#scenario').value=state.scenario;}

function analysisTab(){return `<div class="notice"><strong>Analysis is iterative.</strong><p class="hint">Run Analyze again to incorporate submitted answers or amendments. It generates or regenerates the plan when the requirements are clear.</p></div><div class="grid"><section class="card"><div class="eyebrow">INTERPRETATION.MD</div><h2>Request interpretation</h2><p>Add an Excel download to the report so finance users can work with permitted, filtered data offline.</p><h3>Acceptance</h3><ul class="small-list"><li>Exported rows match the visible filtered result.</li><li>Column headings are understandable.</li><li>Unauthorized rows are never included.</li></ul>${pill('Canonical scope · input revision 3','accent')}</section><section class="card"><div class="eyebrow">SOLUTION_ASSESSMENT.MD</div><h2>Architect's critique</h2><p>Reuse the report's existing query and authorization boundaries. Avoid an independent permission path for exports.</p><h3>Questions and tradeoffs</h3><p class="hint">Large exports need a documented limit. Spreadsheet handling of formulas requires explicit tests.</p>${link('View proposed tasks','request/plan')}</section><section class="card"><div class="eyebrow">QUESTIONS.MD</div><h2>Questions and answers</h2><p class="hint">4 answered · 0 unresolved</p>${table(['Question','Answer'],[['Export format','Excel workbook'],['Which data?','Filtered, permitted rows'],['Who needs it?','Finance users'],['Success criterion','Matches report contents']])}</section><section class="card"><div class="eyebrow">UNRELATED_ISSUES.MD</div><h2>Unrelated issue</h2>${pill('D-0017 · scope decision needed','warn')}<p class="section-gap">An existing CSV export can mishandle a trailing separator.</p><label for="defect-decision" class="hint">Proposed treatment</label><select id="defect-decision"><option value="">Choose a decision…</option value="include">Include in current request</option><option value="defer">Defer · record known defect</option><option value="investigate">Inve function planTab(){const direct=state.direct;const canImplement=state.scenario==='approval'&&state.approved;return `<div class="notice ${state.approved?'':'warning'}"><strong>${direct?'Direct implementation was explicitly authorized.':state.approved?'Plan revision 2 is approved.':'Plan revision 2 needs your approval.'}</strong><p class="hint">${direct?'This example plan was generated internally under direct authorization. It is not labeled human-approved.':'Approval records consent to this plan. Start implementation with a separate command.'}</p></div><section class="card"><div class="flex between"><div><h2>Implementation plan</h2><p class="hint">CR-0042 · input r${state.submitted} · plan r2 · tasks execute sequentially</p></div>${pill(direct?'Direct authorization':state.approved?'Approved':'Awaiting approval',state.approved||direct?'good':'warn')}</div>${table(['Task','Change & affected locations','Done when'],[['01 · Export service','Add workbook generation using authorized report data.<br><code>src/reports/export.py</code>','Filtered rows and headings are preserved.'],['02 · Report action','Add download control and user feedback.<br><code>src/ui/reports/</code>','The user receives a valid workbook or a clear error.'],['03 · Tests','Add export, access, and formula-handling tests.<br><code>tests/reports/</code>','New behavior is covered; full maintained suite passes.'],['04 · Documentation','Update report behavior and support guidance.<br><code>.aih_product/documentation/</code>','Documentation increment applied and checked.'],['05 · Evidence & summary','Verify final state and write implementation results.<br><code>change_requests/active/CR-0042/</code>','All completion evidence is available.']])}<div class="action-row">${btn(state.approved?'Plan approved':'Approve plan r2','approve','',state.approved||state.scenario!=='approval')}${btn('Implement','implement','primary',!canImplement)}${btn('Analyze again','analyze','',state.scenario==='running')}<p class="hint">${ function request(tab){if(!hasRequest())return pageHead('Current request','One request may be open at a time.')+`<section class="card empty"><div class="empty-icon" aria-hidden="true">▤</div><h2>${state.scenario==='setup'?'Finish setup first':'No active request'}</h2><p class="muted">${state.scenario==='setup'?'Configure an agent or manual handoff to proceed.':'Describe a product change to start the next request. Closed requests remain in history.'}</p>${state.scenario==='setup'?link('Open agent settings','settings/agents'):btn('Create example request','create','primary')}</section>`;const content={input:inputTab,analysis:analysisTab,plan:planTab,implementation:implementationTab,verification:verificationTab,outcome:outcomeTab};tab=content[tab]?tab:'input';return pageHead('Add an Excel export',`CR-0042 · ${status()} · one active request`,link('Request help','help/guide','hint'))+requestTabs(tab)+(state.pendingSubmission?`<div class="notice warning"><strong>Amendment r${state.pendingSubmission.revision} submitted.</strong><p class="hint">${state.scenario==='blocked'?'Work remains blocked until reassessment resolves the blocker.':'Waiting for a safe checkpoint. The run still uses input r'+state.submitted+'.'} This prototype does not execute checkpoint processing.</p></div>`:'')+content[tab]();}

function docs(id){id=docContent[id]?id:'exports';state.doc=id;let [title,path,intro,detail]=docContent[id];if(id==='exports'&&state.scenario==='ready')intro='The current product supports CSV and Excel downloads for filtered reports. CR-0042 includes the implementation and passing verification evidence.';return pageHead('Product documentation','Navigate the current implementation, evidence, and known limitations.',btn('Reverse-engineer…','reverse'))+`<div class="field filter-row"><label for="doc-search" class="sr-only">Search documentation</label><input type="search" id="doc-search" placeholder="Search this demo’s four topics…"><div id="doc-results" class="search-results hint" aria-live="polite"></div></div><div class="doc-grid"><aside class="card"><h3>Topic catalog</h3><ul class="tree">${Object.entries(docContent).map(([key,c])=>`<li><a href="#docs/${key}" ${id===key?'aria-current="page"':''}>${c[0]}</a></li>`).join('')}</ul><p class="hint section-gap">Catalogs guide navigation.<br>Leaves hold topic content.</p></aside><article class="card doc-body"><div class="breadcrumb">${path}</div><h2>${title}</h2><div class="flex">${pill('Current implementation')}${pill('Stable topic ID','accent')}</div><p class="section-gap">${intro}</p><h3>Observed behavior</h3><p>${detail}</p><h3>Verification and source</h3><p class="hint">Source: <code>src/reports/</code> · sample fingerprint<br>Verification: ${state.scenario==='ready'?'passed in the selected example state':'see request evidence; not implied by this page'}<br>Deployment: separate milestone</p><div class="callout hint">Planned behavior remains in its request until implemented. Documentation discrepancies require distinguishing observed behavior from intended requirements.</div><div class="action-row">${link('Related request →','request/verification')}${link('Coverage catalog →','docs/catalog')}</div></article></div>`;}

function themeCards(){return Object.entries(themes).map(([id,t])=>`<button class="theme-card" data-theme="${id}" aria-pressed="${prefs.theme===id}" style="--preview-bg:${t.colors.bg};--preview-surface:${t.colors.raised};--preview-text:${t.colors.text};--preview-accent:${t.colors.accent};--preview-on:${t.colors['on-accent']};--preview-font:${fonts[t.heading].value}"><span class="sample">Aa <span class="sample-line">Your workspace</span><span class="sample-button">Primary action</span></span><span class="theme-label">${t.name}<span class="hint" style="display:block;font-weight:400">${t.description}</span></span></button>`).join('');}
function fontOptions(value){return Object.entries(fonts).map(([k,f])=>`<option value="${k}" ${k===value?'selected':''}>${f.label}</option>`).join('');}
function luminance(hex){let c=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function contrast(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function contrastInfo(){const c=effectiveTheme().colors;const checks=[['Text / surface',c.text,c.surface,4.5],['Text / background',c.text,c.bg,4.5],['Secondary text / surface',c.muted,c.surface,4.5],['Secondary text / raised',c.muted,c.raised,4.5],['Button label / accent',c['on-accent'],c.accent,4.5],['Links / surface',c.accent,c.surface,4.5],['Focus / surface',c.focus,c.surface,3],['Success / surface',c.positive,c.surface,4.5],['Warning / surface',c.warning,c.surface,4.5],['Error / surface',c.danger,c.surface,4.5]];return {valid:checks.every(x=>contrast(x[1],x[2])>=x[3]),checks};}
function contrastMarkup(){const {valid,checks}=contrastInfo();return `<p class="${valid?'good-text':'error-text'}"><strong>${valid?'Checked color pairs pass the demo’s thresholds.':'Some color pairs need more contrast before saving.'}</strong></p><p class="hint">${checks.map(x=>`${x[0]}: ${contrast(x[1],x[2]).toFixed(1)}:1`).join(' · ')}</p><p class="hint">This checks selected colors; it is not a complete accessibility audit.</p>`;}
function customControls(){const t=effectiveTheme();return `<div class="grid"><div class="field"><label for="body-font">Body font preset</label><select id="body-font">${fontOptions(t.font)}</select></div><div class="field"><label for="heading-font">Heading font preset</label><select id="heading-font">${fontOptions(t.heading)}</select></div></div><p class="hint">System-installed fonts only. The browser uses the first available font in each stack; no fonts are downloaded.</p><div class="colors">${Object.entries(t.colors).map(([k,v])=>`<div class="color-field"><input type="color" id="color-${k}" data-color="${k}" value="${v}" aria-label="${k.replaceAll('-',' ')} color"><label for="color-${k}">${k.replaceAll('-',' ')} <span class="hint mono" id="hex-${k}">${v}</span></label></div>`).join('')}</div>`;}
function appearance(){return `<section class="card"><div class="flex between"><div><h2>Make the workspace yours</h2><p class="muted">Choose a complete theme, then adjust the reading size.</p></div>${pill('Live preview','accent')}</div><div class="theme-grid">${themeCards()}</div><div class="action-row">${btn('Follow system appearance','system-theme')}${btn('Customize current theme','customize')}<span class="hint">Built-in themes remain available. Customization creates one editable Custom theme.</span></div><div class="field section-gap"><label for="font-size">Interface font size <span id="font-value" class="pill">${prefs.size}px</span></label><input id="font-size" type="range" min="14" max="22" step="1" value="${prefs.size}"><span class="hint">Default 16px · range 14–22px. Controls, spacing, and text scale together. Browser zoom remains available.</span></div><p class="preview-type">Clear decisions. Traceable work.</p><p class="hint">Current body stack: <code>${esc(fonts[effectiveTheme().font].value)}</code></p><div class="action-row">${btn('Save appearance','save-appearance','primary',!contrastInfo().valid)}${btn('Cancel preview','cancel-appearance')}${btn('Reset to defaults','reset-appearance')}</div><p class="theme-status" id="theme-status" aria-live="polite">${state.themeDirty?'Preview has unsaved changes.':'Appearance matches saved preferences.'} ${storageAvailable?'Preferences are saved in this browser only.':'Browser storage is unavailable; this demo session can still preview changes.'}</p></section><section class="card" ${prefs.theme==='custom'?'':'hidden'} id="custom-card"><h2>Custom palette and typography</h2><p class="hint">Editing semantic colors updates controls throughout the portal. No arbitrary CSS or external font URLs are used.</p>${customControls()}</section><section class="card"><h2>Color checks</h2><div id="contrast-report">${contrastMarkup()}</div></section><section class="card"><h2>Component preview</h2><p class="hint">The same theme covers navigation, forms, status, tables, logs, and documentation.</p><div class="component-gallery"><div><h3>Actions and state</h3><div class="flex">${btn('Primary action','sample-primary','primary')}${btn('Secondary','sample-secondary')}${btn('Disabled','sample-disabled','',true)}</div><div class="flex section-gap">${pill('Passed','good')}${pill('Needs review','warn')}${pill('Failed','bad')}</div><p class="hint section-gap">State is conveyed by words as well as color.</p></div><div><h3>Form controls</h3><div class="field"><label for="sample-field">Example field</label><input id="sample-field" placeholder="Type to preview text…"></div><label class="check"><input type="checkbox" checked> Show evidence links</label></div><div><h3>Table</h3>${table(['Task','State'],[['Generate tests','Ready'],['Verify documentation','Pending']])}</div><div><h3>Code and log</h3><pre>10:42:08  CHECKPOINT\nPlan r2 is ready for review.\nNo implementation started.</pre></div></div></section>`;}
function settings(tab){const items=[['appearance','Appearance'],['agents','Agent profiles'],['skills','Skills and integrations'],['product','Product instructions']];tab=items.some(x=>x[0]===tab)?tab:'appearance';return pageHead('Settings','Configure the workspace and how the portal looks.')+`<nav class="tabs" aria-label="Settings sections">${items.map(([id,label])=>`<a href="#settings/${id}" ${id===tab?'aria-current="page"':''}>${label}</a>`).join('')}</nav>`+(tab==='appearance'?appearance():tab==='agents'?`<section class="card"><h2>Agent profiles</h2><p class="hint">Example profile; the demo cannot detect or launch a CLI.</p><div class="field"><label for="profile-name">Profile name</label><input id="profile-name" value="Local agent"></div><div class="field"><label for="adapter">Adapter</label><select id="adapter"><option>Codex</option><option>Manual handoff</option></select></div><div class="field"><label for="profile-capability">Default capability assignment</label><select id="profile-capability"><option>Analysis and implementation</option><option>Analysis only</option><option>Documentation only</option></select></div><div class="action-row">${btn('Check availability','check-profile')}${btn('Save profile','save-profile','primary')}<p class="hint">The real portal reports detected capabilities and errors. Saving a profile never installs a CLI or changes permissions.</p></div></section>`:tab==='skills'?`<section class="card"><h2>Skills and integrations</h2><p>Core workflows work without Git. Optional integrations declare their prerequisites and authority separately.</p>${table(['Skill','State','Requirements'],[['Documentation','Available','Portable Agent Skills format'],['Git extension','Not configured','Optional Git installation and explicit rules']])}<div class="action-row">${btn('Inspect Git extension','inspect-git')}</div></section>`:`<section class="card"><h2>Product custom instructions</h2><div class="notice"><strong>Human edits only.</strong><p class="hint">Agent proposals belong in outputs. Only a direct user action may edit these instructions.</p></div><div class="field"><label for="instructions">Instructions draft</label><textarea id="instructions">Use clear language in user-facing messages.\nFollow the product's existing component conventions.</textarea><span class="hint">This prototype uses an in-memory draft. Changes affect future reads at a safe boundary.</span></div><div class="action-row">${btn('Save instructions','save-instructions','primary')}</div></section>`);}
function help(section){return pageHead('Help','A guide to the framework, the workflow, and each portal action.')+`<div class="grid wide-left"><section class="card"><h2>${section==='recovery'?'Recovery and interruptions':'From request to verified change'}</h2><p>Use the same Analyze command as requirements and answers evolve. Approve the resulting plan, then explicitly start implementation.</p><ol class="small-list"><li><strong>Draft and clarify.</strong> Explain what should change and why; answer requirement questions.</li><li><strong>Analyze.</strong> Submit the latest saved revision; review interpretation, critique, scope decisions, and generated plan.</li><li><strong>Approve.</strong> Approve an exact plan revision. This does not start execution.</li><li><strong>Implement.</strong> Execute sequential tasks, generate tests, and run the complete maintained suite.</li><li><strong>Verify and document.</strong> Resolve required failures and apply the documentation increment.</li><li><strong>Close.</strong> Retain evidence and history. A new request can now begin.</li></ol><details open><summary>What happens when I edit input?</summary><p>Saving creates a draft. Clarify, Analyze, Implement, or Resume submits the latest saved revision. An active process adopts submitted amendments at a safe checkpoint and reassesses scope, approval, and verification.</p></details><details ${section==='recovery'?'open':''}><summary>How do stop, resume, and recovery work?</summary><p>Stop requests a safe checkpoint and leaves the request open. Resume inspects saved evidence and changed state before continuing. A crash may leave uncertain operations; the portal must show that uncertainty instead of inventing success.</p></details><details><summary>Can a blocked request be closed?</summary><p>Yes, as cancelled or rejected. History, partial changes, and unresolved issues are preserved. Required failed tests prohibit successful completion.</p></details><details><summary>What does this HTML demo do?</summary><p>It previews page structure, navigation, themes, font scaling, and selected workflow states using fictional data. Theme settings may persist in this browser. Workflow buttons only simulate actions; no framework is installed and no agent runs.</p></details></section><aside class="stack"><section class="card"><h2>Page guide</h2><ul class="small-list"><li>${link('Current request','request/input')} — scope to outcome</li><li>${link('Ask a question','questions/main')} — read-only answers</li><li>${link('Product documentation','docs/exports')} — current knowledge</li><li>${link('Runs and recovery','runs/main')} — execution evidence</li><li>${link('History','history/main')} — closed requests and decisions</li><li>${link('Appearance','settings/appearance')} — themes and text size</li></ul></section><section class="card"><h2>Demo keyboard use</h2><p class="hint"><kbd class="kbd">Tab</kbd> moves between controls. <kbd class="kbd">Enter</kbd> activates links and buttons. <kbd class="kbd">Esc</kbd> closes dialogs. Browser Back returns to the previous page.</p></section></aside></div>`;}
function render(){const parts=(location.hash.slice(1)||'overview/main').split('/');let [page,tab]=parts;const pages={overview,request,questions,docs,runs,history,settings,help};if(!pages[page]){page='overview';tab='main';}route=page+'/'+(tab||'main');renderShell(page);$('#main').innerHTML=pages[page](tab||'main')+`<p class="footer-note">AIH portal proposal · 22 September 2026 · demonstration only</p>`;document.title=page[0].toUpperCase()+page.slice(1)+' · AIH portal demo';}
function navigate(path){if(state.dirty){dialog('Unsaved request draft','<p>Save or discard your edits before leaving this page.</p>',[{label:'Keep editing',run:closeDialog},{label:'Discard and leave',run:()=>{state.input=inputSaved;state.dirty=false;closeDialog();location.hash=path;}},{label:'Save draft and leave',class:'primary',run:()=>{inputSaved=state.input;state.dirty=false;closeDialog();location.hash=path;}}]);return;}location.hash=path;}
function setScenario(value){state.scenario=value;state.stopped=false;state.direct=false;state.pendingSubmission=null;state.approved=['running','blocked','ready'].includes(value);state.events=[];render();toast('Preview state changed. All displayed workflow data is illustrative.');}
function submitAction(kind){if((state.scenario==='running'&&!state.stopped)||state.scenario==='blocked'){if(state.dirty)return toast('Save your draft before submitting it.');const live=state.scenario==='running';dialog('Submit amendment — simulated action',`<p>${live?'The current process keeps its existing submitted scope until a safe checkpoint.':'The request stays blocked until its blocker is resolved.'} This records a new submitted revision for reassessment; it does not start another writer.</p>`,[{label:'Cancel',run:closeDialog},{label:'Simulate submission',class:'primary',run:()=>{closeDialog();state.pendingSubmission={revision:state.submitted+1,kind,input:inputSaved};render();toast(live?'Amendment submitted. Waiting for a safe checkpoint in this example.':'Amendment submitted. The example request remains blocked pending reassessment.');}}]);return;}if(state.dirty){toast('Save your draft before submitting it.');return;}dialog(kind+' — simulated action',`<p>This would submit the latest saved input and answers, preserve the previous version, and ${kind==='Clarify'?'clarify the requirements without choosing an implementation.':'reassess the request and generate or update the plan.'}</p><p class="hint">This demo does not run an agent. Continue to view an example result.</p>`,[{label:'Cancel',run:closeDialog},{label:'Show example result',class:'primary',run:()=>{closeDialog();state.submitted++;state.pendingSubmission=null;submittedInput=inputSaved;state.approved=false;state.direct=false;state.scenario='approval';location.hash=kind==='Clarify'?'request/input':'request/analysis';render();toast('Example submission recorded in memory. Plan approval was reassessed.');}}]);}
function download(name,body){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function changedAppearance(){state.themeDirty=JSON.stringify(prefs)!==JSON.stringify(savedPrefs);applyTheme();if($('#theme-status'))$('#theme-status').textContent=(state.themeDirty?'Preview has unsaved changes.':'Appearance matches saved preferences.')+' Preferences apply only to this demo browser.';if($('#contrast-report'))$('#contrast-report').innerHTML=contrastMarkup();if($('#font-value'))$('#font-value').textContent=prefs.size+'px';const save=$('[data-action="save-appearance"]');if(save)save.disabled=!contrastInfo().valid;}
function finishRequest(outcome){if(state.scenario==='running'&&!state.stopped)return toast('Stop execution before closing the request.');dialog('Close as '+outcome+'?',`<p>This simulated closure preserves history${outcome==='completed'?', evidence, and the final result':', partial changes, and unresolved issues'}. It permits a new request. No rollback is performed.</p>${outcome==='completed'?'':'<div class="field"><label for="closure-reason">Reason for closure (required)</label><textarea id="closure-reason" rows="3"></textarea></div>'}`,[{label:'Keep request open',run:closeDialog},{label:'Close as '+outcome,class:outcome==='completed'?'primary':'danger',run:()=>{if(outcome!=='completed'&&!$('#closure-reason').value.trim()){toast('Enter a reason for closure.');$('#closure-reason').focus();return;}closeDialog();state.closed=outcome;state.scenario='empty';state.approved=false;state.dirty=false;location.hash='history/main';render();toast('Example request closed as '+outcome+'.');}}]);}
const actions={
 appearance:()=>navigate('settings/appearance'),
 'save-input':()=>{inputSaved=state.input;state.dirty=false;$('#draft-state').textContent='Saved draft · last submitted revision '+state.submitted+'. Saving does not start a run.';toast('Draft saved in this demo session. No run started.');},
 clarify:()=>submitAction('Clarify'),analyze:()=>submitAction('Analyze'),
 'defect-decision':()=>{const decision=$('#defect-decision').value;if(!decision)return toast('Choose include, defer, or investigate.');state.defectSaved=decision;toast('Decision draft saved in memory. Analyze submits it for scope reassessment.');},
 approve:()=>dialog('Approve plan revision 2?','<p>Record approval for this exact plan and its submitted input. Approval alone does not start implementation.</p>',[{label:'Cancel',run:closeDialog},{label:'Approve plan',class:'primary',run:()=>{closeDialog();state.approved=true;render();toast('Plan r2 approved in this simulation. Use Implement to start.');}}]),
 implement:()=>{if(inputSaved!==submittedInput){state.approved=false;toast('Saved amendments require analysis and renewed approval before implementation.');navigate('request/analysis');return;}state.direct=false;state.scenario='running';state.stopped=false;location.hash='request/implementation';render();toast('Showing an implementation example. No agent was launched.');},
 direct:()=>dialog('Implement directly?','<p>This explicitly authorizes skipping the separate Analyze invocation and plan approval. Necessary clarification, an internal sequential plan, tests, documentation, and evidence remain required.</p><p class="hint">This button only switches to a simulated running state.</p>',[{label:'Cancel',run:closeDialog},{label:'Show direct implementation',class:'primary',run:()=>{closeDialog();state.approved=false;state.direct=true;submittedInput=inputSaved;state.scenario='running';location.hash='request/implementation';render();}}]),
 stop:()=>dialog('Stop at a safe boundary?','<p>The active process finishes its current operation safely and records a durable checkpoint. The request remains open.</p>',[{label:'Keep running',run:closeDialog},{label:'Simulate stop',run:()=>{closeDialog();state.stopped=true;render();toast('Example checkpoint recorded. The request remains open.');}}]),
 resume:()=>dialog('Resume from the checkpoint?','<p>Resume submits the latest saved revisions and reassesses changes, authorization, and evidence before continuing. Existing scoped authorization persists.</p>',[{label:'Cancel',run:closeDialog},{label:'Simulate resume',class:'primary',run:()=>{closeDialog();state.stopped=false;state.scenario='running';state.events.push('Resumed from checkpoint');render();toast('Example resumed. No real process is running.');}}]),
 complete:()=>{if(state.scenario==='ready')finishRequest('completed');},'cancel-request':()=>finishRequest('cancelled'),'reject-request':()=>finishRequest('rejected'),
 create:()=>{state.scenario='approval';state.closed=false;state.approved=false;state.input=inputSaved;location.hash='request/input';render();toast('Example request created in memory.');},
 ask:()=>{const q=$('#question-input').value.trim();if(!q){$('#question-input').focus();return toast('Enter a question first.');}state.question=q;state.answer=true;render();toast('Showing a prepared sample answer, not an agent response.');},
 'download-answer':()=>download('AIH_Demo_Answer_Q-0012.md','# DEMONSTRATION — prepared example answer\n\nQuestion: '+state.question+'\n\nThis is a fixed illustration, not an answer generated for the question above.\n\nReport exports reuse the report authorization rules. Only permitted rows are included.\n'),
 'download-log':()=>download('AIH_Demo_Run_Log.txt','DEMONSTRATION ONLY — fictional execution record\n10:44:02 START Approved plan r2; input r3\n10:44:08 TASK 01 Workbook generation changed\n10:44:14 TASK 02 Report action update\n'),
 reverse:()=>dialog('Reverse-engineer current product',hasRequest()?'<p>An open request exists. Documentation maintenance must be an authorized task within that request and must respect its blockers.</p><p class="hint">This demo cannot inspect source or start documentation generation.</p>':'<p>The real command inventories source, records facts and unknowns, and updates documentation using the configured agent. It does not modify product source.</p><p class="hint">This demo cannot inspect source or run an agent.</p>',[{label:'Close',run:closeDialog},{label:hasRequest()?'Review request':'View agent setup',class:'primary',run:()=>{closeDialog();navigate(hasRequest()?'request/plan':'settings/agents');}}]),
 'history-summary':()=>dialog('CR-0041 · completed','<p>Added report filters. Implementation, the required test suite, documentation, and evidence were completed in this fictional historical record.</p><p class="hint">Closed records are read-only. Changes require a new request once no request is open.</p>',[{label:'Close',run:closeDialog}]),
 'history-cancelled':()=>dialog('CR-0040 · cancelled','<p>Scheduled delivery was explored and cancelled by the user. The investigation and unresolved issues were preserved. It was not marked successfully completed.</p>',[{label:'Close',run:closeDialog}]),
 'history-current':()=>dialog('CR-0042 · '+state.closed,'<p>Example request closure recorded in this demo session. Full execution history would remain in the archived request folder.</p>',[{label:'Close',run:closeDialog}]),
 'system-theme':()=>{prefs.theme='system';changedAppearance();render();},
 customize:()=>{prefs.custom=copy(effectiveTheme());prefs.custom.name='Custom';prefs.theme='custom';changedAppearance();render();$('#custom-card').scrollIntoView({behavior:'auto',block:'start'});},
 'save-appearance':()=>{if(!contrastInfo().valid)return toast('Adjust low-contrast color pairs before saving.');savedPrefs=copy(prefs);state.themeDirty=false;try{localStorage.setItem('aih-theme-demo-v1',JSON.stringify(savedPrefs));storageAvailable=true;toast('Appearance saved in this browser. Product execution is unaffected.');}catch{storageAvailable=false;toast('Browser storage is unavailable. Preferences retained for this session only.');}render();},
 'cancel-appearance':()=>{prefs=copy(savedPrefs);state.themeDirty=false;applyTheme();render();toast('Preview cancelled. Saved appearance restored.');},
 'reset-appearance':()=>{prefs=copy(defaultPrefs);changedAppearance();render();toast('Default appearance previewed. Save to keep it.');},
 'check-profile':()=>dialog('Availability check — example','<p>The actual portal checks the configured executable and supported capabilities. This standalone file has no connection to your installed tools.</p><p class="hint">No availability result has been fabricated.</p>',[{label:'Close',run:closeDialog}]),
 'save-profile':()=>{if(!$('#profile-name').value.trim())return toast('A profile name is required.');toast('Profile change simulated. The real portal saves revision-safe configuration and shows when it takes effect.');},
 'save-instructions':()=>toast('Human edit simulated. The real portal saves a versioned instruction revision for the next safe read boundary.'),
 'inspect-git':()=>dialog('Optional Git extension','<p>Git is not a default prerequisite. An extension defines its own operations, dependencies, and authorizations. Installing the framework does not grant push, publication, or deployment authority.</p>',[{label:'Close',run:closeDialog}]),
 'sample-primary':()=>toast('Primary action preview. No workflow action was taken.'),'sample-secondary':()=>toast('Secondary action preview. No workflow action was taken.')
};
document.addEventListener('click',e=>{const choice=e.target.closest('[data-dialog-choice]');if(choice){const item=modalConfirm?.[Number(choice.dataset.dialogChoice)];item?.run();return;}if(e.target.closest('[data-close]'))return closeDialog();const t=e.target.closest('[data-theme]');if(t){prefs.theme=t.dataset.theme;changedAppearance();render();return;}const b=e.target.closest('[data-action]');if(b&&!b.disabled){actions[b.dataset.action]?.();return;}const a=e.target.closest('a[href^="#"]');if(a&&a.getAttribute('href')==='#main'){e.preventDefault();$('#main').focus();$('#main').scrollIntoView({block:'start'});return;}if(a){e.preventDefault();navigate(a.hash.slice(1));}});
document.addEventListener('input',e=>{if(e.target.id==='request-input'){state.input=e.target.value;state.dirty=state.input!==inputSaved;$('#draft-state').textContent=state.dirty?'Unsaved changes. Save before submitting.':'Saved draft. Saving does not start a run.';}if(e.target.id==='font-size'){prefs.size=Number(e.target.value);changedAppearance();}if(e.target.dataset.color){if(!prefs.custom)return;const key=e.target.dataset.color;prefs.custom.colors[key]=e.target.value;$('#hex-'+key).textContent=e.target.value;changedAppearance();}if(e.target.id==='doc-search'){const term=e.target.value.toLowerCase().trim();$('#doc-results').innerHTML=term?Object.entries(docContent).filter(([,c])=>c.join(' ').toLowerCase().includes(term)).map(([k,c])=>link(c[0],'docs/'+k)).join(' · ')||'No matching sample topic.':'';}});
document.addEventListener('change',e=>{if(['body-font','heading-font'].includes(e.target.id)&&prefs.custom){prefs.custom[e.target.id==='body-font'?'font':'heading']=e.target.value;changedAppearance();}if(e.target.id==='scenario'){if(state.dirty){e.target.value=state.scenario;toast('Save or discard your request draft before changing the example state.');return;}setScenario(e.target.value);}});
$('#reset-demo').addEventListener('click',()=>dialog('Reset demo workflow?','<p>Discard simulated workflow changes and return to the initial example. Your saved appearance stays in place.</p>',[{label:'Cancel',run:closeDialog},{label:'Reset demo',run:()=>{closeDialog();state.scenario='approval';state.approved=false;state.direct=false;state.stopped=false;state.dirty=false;state.closed=false;state.submitted=3;submittedInput=inputSaved;state.answer=false;state.question='';state.events=[];state.defectSaved='';state.pendingSubmission=null;location.hash='overview/main';render();}}]));
window.addEventListener('beforeunload',e=>{if(state.dirty||state.themeDirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('hashchange',()=>{if(state.dirty){const next=location.hash.slice(1);history.replaceState(null,'','#'+route);navigate(next);return;}render();$('#main').focus({preventScroll:true});window.scrollTo(0,0);});
render();
</script>
</body>
</html>
