document_id: D3
type: data-dictionary
title: Documentation extension types
status: specified
scope: Initial product documentation type convention; no runtime validator is claimed.
rules:
  primary_type: Exactly one predefined type per document.
  formats: Select a listed inert format suitable for the actual content. HTML is never
    executed as product-state content.
  required_content: Cover listed fields where supported; explicitly record unknown
    or inapplicable aspects rather than inventing them.
  extension: Add or revise types through an explicit convention change, not an ad
    hoc generic category.
  provenance: Every document retains sources, exact locators, certainty, ownership,
    and related entry references in native metadata or catalog.yaml.
  creation: Create only applicable documents; do not generate empty templates.
  size: Use meaningful splits; apply extension-navigation limits and type-appropriate
    size checks; explain indivisible exceptions.
